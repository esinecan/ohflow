name: suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Worker tests
        run: node --test worker/test/*.test.mjs

      - name: Shard 1/3
        run: python tests/run_tests.py --shard 1/3

      - name: Shard 2/3
        if: ${{ !cancelled() }}
        run: python tests/run_tests.py --shard 2/3

      - name: Shard 3/3
        if: ${{ !cancelled() }}
        run: python tests/run_tests.py --shard 3/3

      - name: Real-process tests
        if: ${{ !cancelled() }}
        run: python tests/run_tests.py --real-process

  candidate:
    name: release candidate
    needs: suite
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build complete portable package from this exact commit
        run: python -m release.package build --source "$GITHUB_SHA" --out dist
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  package-smoke:
    name: package smoke (${{ matrix.os }})
    needs: candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Verify and install the same candidate on a clean path
        run: python -m release.package smoke --bundle dist
